<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="client-card">

                <div class="text-center">
                    <div class="icon-circle">👤</div>

                    <h3 class="form-title"
                        th:text="${client.id != null ? 'Edit Client' : 'Add New Client'}">
                    </h3>

                    <div class="sub-text">
                        Manage client information for project and payment tracking
                    </div>
                </div>

                <form action="/clients" method="post" th:object="${client}">

                    <input type="hidden" th:field="*{id}">

                    <div class="mb-4">
                        <label>Client Name</label>
                        <input type="text" class="form-control"
                               placeholder="Enter client full name"
                               th:field="*{name}">
                    </div>

                    <div class="mb-4">
                        <label>Phone Number</label>
                        <input type="text" class="form-control"
                               placeholder="Enter mobile number"
                               th:field="*{phone}">
                    </div>

                    <div class="mb-4">
                        <label>Email Address</label>
                        <input type="email" class="form-control"
                               placeholder="Enter email address"
                               th:field="*{email}">
                    </div>

                    <div class="mb-4">
                        <label>Address / Location</label>
                        <input type="text" class="form-control"
                               placeholder="Enter full address"
                               th:field="*{address}">
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="/clients" class="btn btn-outline-secondary btn-back">← Back</a>

                        <button type="submit" class="btn btn-save text-white"
                                th:text="${client.id != null ? 'Update Client' : 'Save Client'}">
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

</div>
<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
