<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(to right, #f8f9fa, #eef2f7);
            min-height:100vh;
        }

        .client-card{
            border:none;
            border-radius:20px;
            padding:35px;
            background:#ffffff;
            box-shadow:0 10px 35px rgba(0,0,0,0.08);
        }

        .form-title{
            font-weight:700;
            color:#0d6efd;
            font-size:28px;
        }

        .sub-text{
            color:#777;
            font-size:14px;
            margin-bottom:25px;
        }

        .form-control{
            border-radius:12px;
            padding:12px;
            border:1px solid #dcdcdc;
        }

        .form-control:focus{
            box-shadow:none;
            border-color:#0d6efd;
        }

        label{
            font-weight:600;
            margin-bottom:6px;
        }

        .btn-save{
            border-radius:12px;
            padding:10px 30px;
            font-weight:600;
            background:#0d6efd;
            border:none;
        }

        .btn-save:hover{
            background:#0b5ed7;
        }

        .btn-back{
            border-radius:12px;
            padding:10px 25px;
        }

        .icon-circle{
            width:60px;
            height:60px;
            border-radius:50%;
            background:#e8f1ff;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:28px;
            margin:0 auto 15px auto;
            color:#0d6efd;
        }
    </style>
</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="client-card">

                <div class="text-center">
                    <div class="icon-circle">👤</div>

                    <h3 class="form-title"
                        th:text="${client.id != null ? 'Edit Client' : 'Add New Client'}">
                    </h3>

                    <div class="sub-text">
                        Manage client information for project and payment tracking
                    </div>
                </div>

                <form action="/clients" method="post" th:object="${client}">

                    <input type="hidden" th:field="*{id}">

                    <div class="mb-4">
                        <label>Client Name</label>
                        <input type="text" class="form-control"
                               placeholder="Enter client full name"
                               th:field="*{name}">
                    </div>

                    <div class="mb-4">
                        <label>Phone Number</label>
                        <input type="text" class="form-control"
                               placeholder="Enter mobile number"
                               th:field="*{phone}">
                    </div>

                    <div class="mb-4">
                        <label>Email Address</label>
                        <input type="email" class="form-control"
                               placeholder="Enter email address"
                               th:field="*{email}">
                    </div>

                    <div class="mb-4">
                        <label>Address / Location</label>
                        <input type="text" class="form-control"
                               placeholder="Enter full address"
                               th:field="*{address}">
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="/clients" class="btn btn-outline-secondary btn-back">← Back</a>

                        <button type="submit" class="btn btn-save text-white"
                                th:text="${client.id != null ? 'Update Client' : 'Save Client'}">
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
