<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Project Detail')"></head>
    <title>Client Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/app.css}">

</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container mt-4">

    <!-- CLIENT INFO -->
    <div class="card p-4 shadow-sm mb-4">
        <h3 th:text="${client.name}"></h3>
        <p>
            Phone: <span th:text="${client.phone}"></span><br>
            Email: <span th:text="${client.email}"></span><br>
            Address: <span th:text="${client.address}"></span>
        </p>
    </div>

    <!-- SUMMARY -->
    <div class="row mb-4">

        <div class="col-md-3">
            <div class="card p-3 shadow-sm">
                <div>Total Projects</div>
                <div class="big" th:text="${totalProjects}"></div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3 shadow-sm">
                <div>Total Contract</div>
                <div class="big" th:text="${totalProjectCost}"></div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3 shadow-sm">
                <div class="text-success">Received</div>
                <div class="big" th:text="${totalReceived}"></div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3 shadow-sm">
                <div class="text-danger">Pending</div>
                <div class="big" th:text="${pendingAmount}"></div>
            </div>
        </div>

    </div>

    <!-- PROJECT LIST -->
    <div class="card p-3 shadow-sm mb-4">
        <h5>Projects</h5>

        <table class="table table-bordered">
            <thead>
            <tr>
                <th>Project Name</th>
                <th>Total Cost</th>
                <th>Status</th>
                <th>Progress</th>
                <th>View</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="p : ${projects}">
                <td th:text="${p.projectName}"></td>
                <td th:text="${p.totalCost}"></td>
                <td th:text="${p.status}"></td>
                <td th:text="${p.progressPercent + '%'}"></td>
                <td>
                    <a class="btn btn-sm btn-primary"
                       th:href="@{'/projects/' + ${p.id}}">
                        Open
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- PAYMENT HISTORY -->
    <div class="card p-3 shadow-sm">
        <h5>All Payment History</h5>

        <table class="table table-striped">
            <thead>
            <tr>
                <th>Date</th>
                <th>Project</th>
                <th>Amount</th>
                <th>Mode</th>
                <th>Note</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="pay : ${payments}">
                <td th:text="${pay.paymentDate}"></td>
                <td th:text="${pay.project.projectName}"></td>
                <td th:text="${pay.amount}"></td>
                <td th:text="${pay.paymentMode}"></td>
                <td th:text="${pay.note}"></td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
