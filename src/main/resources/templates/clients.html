<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Clients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <!-- TOP HEADER -->
    <div class="d-flex justify-content-between align-items-center top-box">
        <div>
            <div class="page-title">
                Client Management
                <span class="count-badge" th:text="${#lists.size(clients)} + ' Clients'"></span>
            </div>
            <div class="sub-title">Manage all registered clients and their activity status</div>
        </div>

        <a class="btn btn-primary btn-add" href="/clients/new">
            + Add Client
        </a>
    </div>

    <!-- TABLE CARD -->
    <div class="list-card">

        <table class="table align-middle">

            <thead>
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Status</th>
                <th width="220">Action</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="c : ${clients}">
                <td>
                    <a class="name-link"
                       th:href="@{'/clients/' + ${c.id}}"
                       th:text="${c.name}">
                    </a>
                </td>

                <td th:text="${c.phone}"></td>

                <td th:text="${c.email}"></td>

                <td>
                    <span class="status-active" th:if="${c.active}">Active</span>
                    <span class="status-inactive" th:if="${!c.active}">Inactive</span>
                </td>

                <td>

                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{'/clients/' + ${c.id}}">
                        View
                    </a>

                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{'/clients/edit/' + ${c.id}}">
                        Edit
                    </a>

                    <a class="btn btn-sm btn-outline-danger"
                       th:if="${c.active}"
                       onclick="return confirm('Delete this client?')"
                       th:href="@{'/clients/delete/' + ${c.id}}">
                        Delete
                    </a>

                    <span class="btn btn-sm btn-secondary disabled"
                          th:if="${!c.active}">
                        Inactive
                    </span>

                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(clients)}">
                <td colspan="5" class="text-center text-muted p-5">
                    No clients available
                </td>
            </tr>

            </tbody>

        </table>

    </div>

</div>
<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
