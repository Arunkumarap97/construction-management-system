<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Expense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="expense-card">

                <div class="text-center">
                    <div class="icon-circle">💸</div>

                    <h3 class="form-title"
                        th:text="${expense.id != null ? 'Edit Expense' : 'Add Expense'}">
                    </h3>

                    <div class="sub-text">
                        Track material, labour and miscellaneous expenses
                    </div>
                </div>

                <form action="/expenses" method="post" th:object="${expense}">

                    <input type="hidden" th:field="*{id}">

                    <!-- ROW 1 -->
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label>Expense Date</label>
                            <input type="date" class="form-control" th:field="*{expenseDate}">
                        </div>

                        <div class="col-md-6 mb-4">
                            <label>Category</label>
                            <select class="form-select" th:field="*{category}">
                                <option value="MATERIAL">MATERIAL</option>
                                <option value="LABOUR">LABOUR</option>
                                <option value="TRANSPORT">TRANSPORT</option>
                                <option value="ELECTRICAL">ELECTRICAL</option>
                                <option value="PLUMBING">PLUMBING</option>
                                <option value="PAINTING">PAINTING</option>
                                <option value="CARPENTRY">CARPENTRY</option>
                                <option value="MISC">MISC</option>
                            </select>
                        </div>
                    </div>

                    <!-- ROW 2 -->
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label>Vendor / Worker Name</label>
                            <input type="text" class="form-control"
                                   placeholder="Enter vendor or worker name"
                                   th:field="*{vendorName}">
                        </div>

                        <div class="col-md-6 mb-4">
                            <label>Amount</label>
                            <input type="number" step="0.01" class="form-control"
                                   placeholder="Enter amount"
                                   th:field="*{amount}">
                        </div>
                    </div>

                    <!-- ROW 3 -->
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label>Project</label>
                            <select class="form-select" th:field="*{projectId}">
                                <option value="">General Expense</option>
                                <option th:each="p : ${projects}"
                                        th:value="${p.id}"
                                        th:text="${p.projectName}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-4">
                            <label>Note</label>
                            <input type="text" class="form-control"
                                   placeholder="Additional note"
                                   th:field="*{note}">
                        </div>
                    </div>

                    <!-- BUTTONS -->
                    <div class="d-flex justify-content-between mt-4">
                        <a href="/expenses" class="btn btn-outline-secondary btn-back">← Back</a>

                        <button class="btn btn-save text-white"
                                th:text="${expense.id != null ? 'Update Expense' : 'Save Expense'}">
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

</div>
<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
