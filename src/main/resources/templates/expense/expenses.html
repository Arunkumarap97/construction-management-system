<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Expenses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(to right, #f8f9fa, #eef2f7);
            min-height:100vh;
        }

        .page-title{
            font-size:28px;
            font-weight:700;
            color:#222;
        }

        .sub-title{
            color:#777;
            font-size:14px;
        }

        .top-box{
            margin-bottom:20px;
        }

        .list-card{
            background:#fff;
            border:none;
            border-radius:20px;
            box-shadow:0 10px 35px rgba(0,0,0,0.07);
            overflow:hidden;
        }

        .table{
            margin:0;
        }

        .table thead{
            background:#f7f8fa;
        }

        .table th{
            padding:18px;
            font-size:14px;
            color:#555;
            border:none;
        }

        .table td{
            padding:18px;
            vertical-align:middle;
            border-top:1px solid #f1f1f1;
        }

        .table tbody tr:hover{
            background:#fafcff;
        }

        .btn-add{
            border-radius:12px;
            padding:10px 20px;
            font-weight:600;
        }

        .btn-sm{
            border-radius:10px;
            padding:4px 10px;
        }

        .amount-red{
            color:#dc3545;
            font-weight:700;
        }

        .badge-cat{
            background:#eef3ff;
            color:#0d6efd;
            padding:6px 14px;
            border-radius:30px;
            font-size:12px;
            font-weight:600;
        }

        .count-badge{
            background:#dc3545;
            color:white;
            border-radius:20px;
            padding:4px 12px;
            font-size:12px;
            margin-left:10px;
        }

        .summary-line{
            margin:15px 0 20px;
            font-size:15px;
            font-weight:600;
            color:#dc3545;
        }

    </style>
</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center top-box">
        <div>
            <div class="page-title">
                Expense Register
                <span class="count-badge" th:text="${#lists.size(expenses)} + ' Entries'"></span>
            </div>
            <div class="sub-title">Track all labour, material and miscellaneous spending</div>
        </div>

        <a class="btn btn-danger btn-add" href="/expenses/new">
            + Add Expense
        </a>
    </div>

    <div class="list-card p-3 mb-4" style="display:inline-block;">
        <span style="font-size:13px;color:#777;">Total Expense Till Date</span><br>
        <span style="font-size:24px;font-weight:700;color:#dc3545;">
        ₹ <span th:text="${totalExpense}"></span>
    </span>
    </div>

    <div class="list-card">

        <table class="table align-middle">

            <thead>
            <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Vendor</th>
                <th>Project</th>
                <th>Amount</th>
                <th>Note</th>
                <th width="170">Action</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="e : ${expenses}">
                <td th:text="${e.expenseDate}"></td>

                <td>
                    <span class="badge-cat" th:text="${e.category}"></span>
                </td>

                <td th:text="${e.vendorName}"></td>

                <td th:text="${e.project != null ? e.project.projectName : 'General Expense'}"></td>

                <td class="amount-red" th:text="'₹ ' + ${e.amount}"></td>

                <td th:text="${e.note}"></td>

                <td>
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{'/expenses/edit/' + ${e.id}}">
                        Edit
                    </a>

                    <a class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Delete this expense?')"
                       th:href="@{'/expenses/delete/' + ${e.id}}">
                        Delete
                    </a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(expenses)}">
                <td colspan="7" class="text-center text-muted p-5">
                    No expenses recorded
                </td>
            </tr>

            </tbody>

        </table>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
