<!DOCTYPE html>

<head th:fragment="head(title)">

    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>

<div th:fragment="header(title)">

        <div class="fw-bold" th:text="${title}">Page</div>

<div th:fragment="footer">

<div th:fragment="scripts">

</html>
