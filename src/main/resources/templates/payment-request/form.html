<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="client-card">

                <div class="text-center">
                    <div class="icon-circle">💳</div>

                    <h3 class="form-title">
                        Create Payment Request
                    </h3>

                    <div class="sub-text">
                        Generate a payment request with UPI QR and bank details
                    </div>
                </div>

                <form action="/payment-requests" method="post" th:object="${paymentRequest}">

                    <div class="mb-4">
                        <label>Project</label>
                        <select th:field="*{projectId}" class="form-select" required>
                            <option value="">Select Project</option>
                            <option th:each="p : ${projects}"
                                    th:value="${p.id}"
                                    th:text="${p.projectName}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label>Amount</label>
                        <input type="number"
                               step="0.01"
                               min="1"
                               class="form-control"
                               placeholder="Enter request amount"
                               th:field="*{amount}"
                               required>
                    </div>

                    <div class="mb-4">
                        <label>Remarks</label>
                        <input type="text"
                               class="form-control"
                               placeholder="Example: First stage payment / Material advance"
                               th:field="*{remarks}">
                    </div>

                    <div class="mb-4">
                        <label>Bank / UPI Account</label>
                        <select th:field="*{bankAccountId}" class="form-select" required>
                            <option value="">Select Bank Account</option>
                            <option th:each="b : ${banks}"
                                    th:value="${b.id}"
                                    th:text="${b.bankName + ' - ' + b.accountHolder}">
                            </option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="/payment-requests" class="btn btn-outline-secondary btn-back">← Back</a>

                        <button type="submit" class="btn btn-save text-white">
                            Generate Request
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
