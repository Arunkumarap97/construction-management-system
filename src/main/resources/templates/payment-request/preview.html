<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment Request Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="client-card">

                <div class="text-center">
                    <div class="icon-circle">📲</div>

                    <h3 class="form-title">Payment Request Preview</h3>

                    <div class="sub-text">
                        Share this request with the client for payment
                    </div>
                </div>

                <div class="list-card p-4 mb-4">

                    <h5 class="mb-3">Request Details</h5>

                    <div class="row mb-2">
                        <div class="col-md-4 text-muted">Project</div>
                        <div class="col-md-8 fw-semibold" th:text="${pr.project.projectName}"></div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-md-4 text-muted">Client</div>
                        <div class="col-md-8 fw-semibold" th:text="${pr.project.client.name}"></div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-md-4 text-muted">Amount</div>
                        <div class="col-md-8 fw-bold text-success">
                            ₹ <span th:text="${pr.amount}"></span>
                        </div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-md-4 text-muted">Remarks</div>
                        <div class="col-md-8" th:text="${pr.remarks}"></div>
                    </div>

                    <div class="row mb-2">
                        <div class="col-md-4 text-muted">Status</div>
                        <div class="col-md-8">
                            <span class="badge-ongoing" th:text="${pr.status}"></span>
                        </div>
                    </div>

                </div>

                <div class="row g-4">

                    <div class="col-md-6">
                        <div class="list-card p-4 h-100">
                            <h5 class="mb-3">Bank Details</h5>

                            <div class="mb-2">
                                <small class="text-muted">Bank Name</small>
                                <div class="fw-semibold" th:text="${pr.bankAccount.bankName}"></div>
                            </div>

                            <div class="mb-2">
                                <small class="text-muted">Account Holder</small>
                                <div class="fw-semibold" th:text="${pr.bankAccount.accountHolder}"></div>
                            </div>

                            <div class="mb-2">
                                <small class="text-muted">Account Number</small>
                                <div class="fw-semibold" th:text="${pr.bankAccount.accountNumber}"></div>
                            </div>

                            <div class="mb-2">
                                <small class="text-muted">IFSC Code</small>
                                <div class="fw-semibold" th:text="${pr.bankAccount.ifscCode}"></div>
                            </div>

                            <div class="mb-2">
                                <small class="text-muted">UPI ID</small>
                                <div class="fw-semibold" th:text="${pr.bankAccount.upiId}"></div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="list-card p-4 h-100 text-center">
                            <h5 class="mb-3">Scan & Pay</h5>

                            <img th:src="@{'/payment-requests/qr/' + ${pr.id}}"
                                 width="220"
                                 class="img-fluid border rounded p-2 bg-white">

                            <div class="mt-3 text-muted small">
                                Scan using GPay / PhonePe / Paytm / any UPI app
                            </div>
                        </div>
                    </div>

                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/payment-requests/new" class="btn btn-outline-secondary btn-back">
                        ← New Request
                    </a>

                    <a th:href="@{'/payment-requests/' + ${pr.id} + '/pdf'}"
                       class="btn btn-save text-white">
                        Download Request PDF
                    </a>
                </div>

            </div>

        </div>
    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
