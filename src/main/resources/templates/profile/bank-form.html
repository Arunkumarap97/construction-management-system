<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Bank</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="client-card">

                <!-- HEADER -->
                <div class="text-center">
                    <div class="icon-circle">🏦</div>

                    <h3 class="form-title"
                        th:text="${bank.id != null ? 'Edit Bank Account' : 'Add Bank Account'}">
                    </h3>

                    <div class="sub-text">
                        Manage bank details for payment requests and QR generation
                    </div>
                </div>

                <!-- FORM -->
                <form action="/profile/banks" method="post" th:object="${bank}">

                    <input type="hidden" th:field="*{id}">

                    <div class="mb-4">
                        <label>Bank Name</label>
                        <input type="text" class="form-control"
                               placeholder="Enter bank name"
                               th:field="*{bankName}">
                    </div>

                    <div class="mb-4">
                        <label>Account Holder</label>
                        <input type="text" class="form-control"
                               placeholder="Enter account holder name"
                               th:field="*{accountHolder}">
                    </div>

                    <div class="mb-4">
                        <label>Account Number</label>
                        <input type="text" class="form-control"
                               placeholder="Enter account number"
                               th:field="*{accountNumber}">
                    </div>

                    <div class="mb-4">
                        <label>IFSC Code</label>
                        <input type="text" class="form-control"
                               placeholder="Enter IFSC code"
                               th:field="*{ifscCode}">
                    </div>

                    <div class="mb-4">
                        <label>UPI ID</label>
                        <input type="text" class="form-control"
                               placeholder="Enter UPI ID (e.g. name@upi)"
                               th:field="*{upiId}">
                    </div>

                    <!-- DEFAULT CHECKBOX -->
                    <div class="form-check mb-4">
                        <input type="checkbox"
                               class="form-check-input"
                               th:field="*{isDefault}">
                        <label class="form-check-label">
                            Set as Default Account
                        </label>
                    </div>

                    <!-- ACTION BUTTONS -->
                    <div class="d-flex justify-content-between mt-4">
                        <a href="/profile" class="btn btn-outline-secondary btn-back">← Back</a>

                        <button type="submit"
                                class="btn btn-save text-white"
                                th:text="${bank.id != null ? 'Update Bank' : 'Save Bank'}">
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
