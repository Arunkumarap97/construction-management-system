<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bank Accounts</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <!-- TOP HEADER -->
    <div class="d-flex justify-content-between align-items-center top-box">
        <div>
            <div class="page-title">
                Bank Accounts
                <span class="count-badge" th:text="${#lists.size(banks)} + ' Accounts'"></span>
            </div>
            <div class="sub-title">Manage bank accounts and UPI details for payment requests</div>
        </div>

        <a class="btn btn-primary btn-add" href="/profile/banks/new">
            + Add Bank
        </a>
    </div>

    <!-- TABLE CARD -->
    <div class="list-card">

        <table class="table align-middle">

            <thead>
            <tr>
                <th>Bank</th>
                <th>Account Holder</th>
                <th>Account Number</th>
                <th>UPI</th>
                <th>Default</th>
                <th width="180">Action</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="b : ${banks}">
                <td class="fw-semibold" th:text="${b.bankName}"></td>

                <td th:text="${b.accountHolder}"></td>

                <td th:text="${b.accountNumber}"></td>

                <td th:text="${b.upiId}"></td>

                <td>
                    <span th:if="${b.isDefault}" class="badge bg-success">Default</span>
                    <span th:if="${!b.isDefault}" class="text-muted">-</span>
                </td>

                <td>
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{'/profile/banks/edit/' + ${b.id}}">
                        Edit
                    </a>

                    <a class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('Delete this bank account?')"
                       th:href="@{'/profile/banks/delete/' + ${b.id}}">
                        Delete
                    </a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(banks)}">
                <td colspan="6" class="text-center text-muted p-5">
                    No bank accounts added yet
                </td>
            </tr>

            </tbody>

        </table>

    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
