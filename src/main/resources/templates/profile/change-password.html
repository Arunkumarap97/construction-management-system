<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Change Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="client-card">

                <div class="text-center">
                    <div class="icon-circle">🔑</div>

                    <h3 class="form-title">Change Password</h3>

                    <div class="sub-text">
                        Update your account login password
                    </div>
                </div>

                <div th:if="${error == 'current_invalid'}" class="alert alert-danger">
                    Current password is incorrect.
                </div>

                <div th:if="${error == 'password_mismatch'}" class="alert alert-warning">
                    New password and confirm password do not match.
                </div>

                <div th:if="${error == 'weak_password'}" class="alert alert-warning">
                    Password must be at least 6 characters.
                </div>

                <form action="/profile/change-password" method="post">

                    <div class="mb-4">
                        <label>Current Password</label>
                        <input type="password"
                               name="currentPassword"
                               class="form-control"
                               placeholder="Enter current password"
                               required>
                    </div>

                    <div class="mb-4">
                        <label>New Password</label>
                        <input type="password"
                               name="newPassword"
                               class="form-control"
                               placeholder="Enter new password"
                               required>
                    </div>

                    <div class="mb-4">
                        <label>Confirm Password</label>
                        <input type="password"
                               name="confirmPassword"
                               class="form-control"
                               placeholder="Confirm new password"
                               required>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="/profile" class="btn btn-outline-secondary btn-back">← Back</a>

                        <button type="submit" class="btn btn-save text-white">
                            Change Password
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
