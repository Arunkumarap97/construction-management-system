<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Project Detail</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f4f6f9; }
        .card { border-radius: 12px; }
        .big { font-size: 22px; font-weight: bold; }
    </style>
</head>

<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="container mt-5">

    <!-- PROJECT HEADER -->
    <div class="d-flex justify-content-between align-items-center top-box">
        <div>
            <h3 th:text="${project.projectName}"></h3>
            <p>
                Client: <b th:text="${project.client.name}"></b><br>
                Location: <span th:text="${project.location}"></span>
            </p>
        </div>

        <a th:href="@{'/projects/edit/' + ${project.id}}" class="btn btn-warning">
            ✏️ Edit
        </a>
    </div>

    <!-- FINANCIAL SUMMARY -->
    <div class="row mb-4">

        <div class="col-md-4">
            <div class="card p-3 shadow-sm">
                <div>Total Cost</div>
                <div class="big" th:text="'₹ ' + ${project.totalCost}"></div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow-sm">
                <div class="text-success">Paid</div>
                <div class="big" th:text="'₹ ' + ${totalPaid}"></div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow-sm">
                <div class="text-danger">Pending</div>
                <div class="big" th:text="'₹ ' + ${pending}"></div>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card p-3 shadow-sm">
                <div class="text-primary">Expense</div>
                <div class="big" th:text="'₹ ' + ${totalExpense}"></div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow-sm">
                <div class="text-info">Site Balance</div>
                <div class="big" th:text="'₹ ' + ${siteBalance}"></div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 shadow-sm">
                <div class="text-secondary">Est. Profit</div>
                <div class="big" th:text="'₹ ' + ${estimatedProfit}"></div>
            </div>
        </div>
    </div>



    <!-- PROGRESS BAR -->
    <div class="card p-3 mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>Progress</div>

            <form th:action="@{'/projects/' + ${project.id} + '/progress'}"
                  method="post"
                  class="d-flex gap-2">

                <input type="number"
                       name="progress"
                       class="form-control form-control-sm"
                       style="width: 80px"
                       min="0" max="100"
                       th:value="${project.progressPercent}">

                <button class="btn btn-sm btn-warning">Update</button>
            </form>
        </div>

        <div class="progress mt-2">
            <div class="progress-bar bg-success"
                 th:style="'width:' + ${project.progressPercent} + '%'"
                 th:text="${project.progressPercent + '%'}">
            </div>
        </div>
    </div>

    <!-- PAYMENT HISTORY -->
    <div class="card p-3 mb-4 shadow-sm">
        <h5>Payment History</h5>

        <table class="table table-striped">
            <thead>
            <tr>
                <th>Date</th>
                <th>Amount</th>
                <th>Mode</th>
                <th>Note</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="p : ${payments}">
                <td th:text="${p.paymentDate}"></td>
                <td th:text="'₹ ' + ${p.amount}"></td>
                <td th:text="${p.paymentMode}"></td>
                <td th:text="${p.note}"></td>
            </tr>

            <tr th:if="${#lists.isEmpty(payments)}">
                <td colspan="4" class="text-center">No payments yet</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- EXPENSE HISTORY -->
    <div class="card p-3 mb-4 shadow-sm">
        <h5>Project Expense History</h5>

        <table class="table table-striped">
            <thead>
            <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Vendor</th>
                <th>Amount</th>
                <th>Note</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="e : ${expenses}">
                <td th:text="${e.expenseDate}"></td>
                <td th:text="${e.category}"></td>
                <td th:text="${e.vendorName}"></td>
                <td th:text="'₹ ' + ${e.amount}"></td>
                <td th:text="${e.note}"></td>
            </tr>

            <tr th:if="${#lists.isEmpty(expenses)}">
                <td colspan="5" class="text-center">No expenses yet</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- ADD PAYMENT -->
    <div class="card p-4 mb-4 shadow-sm">
        <h5>Add Payment</h5>

        <form th:action="@{'/projects/' + ${project.id} + '/payment'}"
              method="post"
              th:object="${newPayment}">

            <div class="row g-3">
                <div class="col-md-3">
                    <label>Amount</label>
                    <input type="number" step="0.01" min="1" required class="form-control" th:field="*{amount}">
                </div>

                <div class="col-md-3">
                    <label>Date</label>
                    <input type="date" class="form-control" th:field="*{paymentDate}">
                </div>

                <div class="col-md-3">
                    <label>Mode</label>
                    <select class="form-select" th:field="*{paymentMode}">
                        <option value="CASH">Cash</option>
                        <option value="UPI">UPI</option>
                        <option value="BANK">Bank</option>
                        <option value="CHEQUE">Cheque</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label>Note</label>
                    <input type="text" class="form-control" th:field="*{note}">
                </div>
            </div>

            <div class="mt-3 text-end">
                <button class="btn btn-success">+ Add Payment</button>
            </div>
        </form>
    </div>

    <!-- ADD EXPENSE -->
    <div class="card p-4 shadow-sm">
        <h5>Add Expense</h5>

        <form th:action="@{'/projects/' + ${project.id} + '/expense'}"
              method="post"
              th:object="${newExpense}">

            <div class="row g-3">
                <div class="col-md-2">
                    <label>Date</label>
                    <input type="date" class="form-control" th:field="*{expenseDate}">
                </div>

                <div class="col-md-2">
                    <label>Category</label>
                    <select class="form-select" th:field="*{category}">
                        <option value="MATERIAL">MATERIAL</option>
                        <option value="LABOUR">LABOUR</option>
                        <option value="TRANSPORT">TRANSPORT</option>
                        <option value="ELECTRICAL">ELECTRICAL</option>
                        <option value="PLUMBING">PLUMBING</option>
                        <option value="PAINTING">PAINTING</option>
                        <option value="CARPENTRY">CARPENTRY</option>
                        <option value="MISC">MISC</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label>Vendor</label>
                    <input type="text" class="form-control" th:field="*{vendorName}">
                </div>

                <div class="col-md-2">
                    <label>Amount</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{amount}">
                </div>

                <div class="col-md-4">
                    <label>Note</label>
                    <input type="text" class="form-control" th:field="*{note}">
                </div>
            </div>

            <div class="mt-3 text-end">
                <button class="btn btn-danger">+ Add Expense</button>
            </div>
        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
