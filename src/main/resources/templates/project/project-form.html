<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="project-card">

                <div class="text-center">
                    <div class="icon-circle">🏗️</div>

                    <h3 class="form-title"
                        th:text="${project.id != null ? 'Edit Project' : 'Add New Project'}">
                    </h3>

                    <div class="sub-text">
                        Manage construction projects and client assignments
                    </div>
                </div>

                <form action="/projects" method="post" th:object="${project}">

                    <input type="hidden" th:field="*{id}">

                    <!-- ROW 1 -->
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label>Project Name</label>
                            <input type="text" class="form-control"
                                   placeholder="Enter project name"
                                   th:field="*{projectName}" required>
                        </div>

                        <div class="col-md-6 mb-4">
                            <label>Client</label>
                            <select class="form-select" th:field="*{clientId}" required>
                                <option value="">Select Client</option>
                                <option th:each="c : ${clients}"
                                        th:value="${c.id}"
                                        th:text="${c.name}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <!-- ROW 2 -->
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label>Total Cost</label>
                            <input type="number" class="form-control"
                                   placeholder="Enter total cost"
                                   th:field="*{totalCost}" required>
                        </div>

                        <div class="col-md-6 mb-4">
                            <label>Status</label>
                            <select class="form-select" th:field="*{status}">
                                <option value="ONGOING">ONGOING</option>
                                <option value="COMPLETED">COMPLETED</option>
                            </select>
                        </div>
                    </div>

                    <!-- ROW 3 -->
<!--                    <div class="row">-->
<!--                        <div class="col-md-6 mb-4">-->
<!--                            <label>Progress (%)</label>-->
<!--                            <input type="number" class="form-control"-->
<!--                                   min="0" max="100"-->
<!--                                   placeholder="0 - 100"-->
<!--                                   th:field="*{progressPercent}">-->
<!--                        </div>-->

<!--                        <div class="col-md-6 mb-4">-->
<!--                            <label>Location</label>-->
<!--                            <input type="text" class="form-control"-->
<!--                                   placeholder="Project location"-->
<!--                                   th:field="*{location}">-->
<!--                        </div>-->
<!--                    </div>-->

                    <!-- ROW 3 -->
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label>Project Type</label>

                            <select class="form-select"
                                    id="projectTypeSelect"
                                    th:field="*{projectType.id}"
                                    required>

                                <option value="">Select Project Type</option>

                                <option th:each="type : ${projectTypes}"
                                        th:value="${type.id}"
                                        th:text="${type.typeName}"
                                        th:attr="data-type-name=${type.typeName}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-4" id="floorsField">
                            <label>No. of Floors</label>
                            <input type="number"
                                   class="form-control"
                                   min="0"
                                   placeholder="Example: 1, 2, 3"
                                   th:field="*{numberOfFloors}">
                            <small class="text-muted">Use 0 if not applicable</small>
                        </div>
                    </div>

                    <!-- BUTTONS -->
                    <div class="d-flex justify-content-between mt-4">
                        <a href="/projects" class="btn btn-outline-secondary btn-back">← Back</a>

                        <button type="submit" class="btn btn-save text-white"
                                th:text="${project.id != null ? 'Update Project' : 'Save Project'}">
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

</div>
<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleFloorsField() {
        const select = document.getElementById("projectTypeSelect");
        const floorsField = document.getElementById("floorsField");
        const floorsInput = floorsField.querySelector("input");

        const selectedOption = select.options[select.selectedIndex];
        const typeName = selectedOption.getAttribute("data-type-name");

        if (typeName === "Interior" || typeName === "Maintenance") {
            floorsField.style.display = "none";
            floorsInput.value = 0;
        } else {
            floorsField.style.display = "block";

            if (!floorsInput.value || floorsInput.value == 0) {
                floorsInput.value = 1;
            }
        }
    }
    document.addEventListener("DOMContentLoaded", toggleFloorsField);
    document.getElementById("projectTypeSelect")
        .addEventListener("change", toggleFloorsField);
</script>
</body>
</html>
