<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Projects</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<!-- 🔥 NAVBAR -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- 🔥 MAIN CONTENT -->
<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center top-box">
        <div>
            <div class="page-title">
                Project Management
                <span class="count-badge" th:text="${#lists.size(projects)} + ' Projects'"></span>
            </div>
            <div class="sub-title">
                Manage all construction projects, status and cost details
            </div>
        </div>

        <a href="/projects/new" class="btn btn-primary btn-add">
            + Add Project
        </a>
    </div>

    <div class="list-card">

        <table class="table align-middle">
            <thead>
            <tr>
                <th>Project Name</th>
                <th>Client</th>
                <th>Total Cost</th>
                <th>Status</th>
                <th width="220">Action</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="p : ${projects}">
                <td class="project-name" th:text="${p.projectName}"></td>

                <td th:text="${p.client.name}"></td>

                <td class="cost" th:text="'₹ ' + ${p.totalCost}"></td>

                <td>
                    <span th:if="${p.status == 'ONGOING'}" class="badge-ongoing">ONGOING</span>
                    <span th:if="${p.status == 'COMPLETED'}" class="badge-completed">COMPLETED</span>
                </td>

                <td>
                    <a th:href="@{'/projects/' + ${p.guid}}" class="btn btn-sm btn-outline-success">View</a>
                    <a th:href="@{'/projects/edit/' + ${p.guid}}" class="btn btn-sm btn-outline-primary">Edit</a>
                    <a th:if="${p.active}"
                       th:href="@{'/projects/delete/' + ${p.guid}}"
                       onclick="return confirm('Archive this project?');"
                       class="btn btn-sm btn-outline-danger">
                        Archive
                    </a>

                    <span th:if="${!p.active}"
                          class="btn btn-sm btn-secondary disabled">
    Archived
</span>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(projects)}">
                <td colspan="5" class="text-center text-muted p-5">
                    No projects available
                </td>
            </tr>

            </tbody>
        </table>

    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
