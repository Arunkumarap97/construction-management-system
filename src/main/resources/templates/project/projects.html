<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Projects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(to right, #f8f9fa, #eef2f7);
            min-height:100vh;
        }

        .page-title{
            font-size:28px;
            font-weight:700;
            color:#222;
        }

        .sub-title{
            color:#777;
            font-size:14px;
        }

        .top-box{
            margin-bottom:25px;
        }

        .list-card{
            background:#fff;
            border:none;
            border-radius:20px;
            box-shadow:0 10px 35px rgba(0,0,0,0.07);
            overflow:hidden;
        }

        .table{
            margin:0;
        }

        .table thead{
            background:#f7f8fa;
        }

        .table th{
            padding:18px;
            font-size:14px;
            color:#555;
            border:none;
        }

        .table td{
            padding:18px;
            vertical-align:middle;
            border-top:1px solid #f1f1f1;
        }

        .table tbody tr:hover{
            background:#fafcff;
        }

        .btn-add{
            border-radius:12px;
            padding:10px 20px;
            font-weight:600;
        }

        .btn-sm{
            border-radius:10px;
            padding:4px 10px;
        }

        .project-name{
            font-weight:600;
            color:#0d6efd;
        }

        .cost{
            font-weight:600;
            color:#198754;
        }

        .badge-ongoing{
            background:#fff4d8;
            color:#c58a00;
            padding:6px 14px;
            border-radius:30px;
            font-size:12px;
            font-weight:600;
        }

        .badge-completed{
            background:#e7f8ee;
            color:#198754;
            padding:6px 14px;
            border-radius:30px;
            font-size:12px;
            font-weight:600;
        }

        .count-badge{
            background:#0d6efd;
            color:white;
            border-radius:20px;
            padding:4px 12px;
            font-size:12px;
            margin-left:10px;
        }
    </style>
</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center top-box">
        <div>
            <div class="page-title">
                Project Management
                <span class="count-badge" th:text="${#lists.size(projects)} + ' Projects'"></span>
            </div>
            <div class="sub-title">Manage all construction projects, status and cost details</div>
        </div>

        <a href="/projects/new" class="btn btn-primary btn-add">
            + Add Project
        </a>
    </div>

    <div class="list-card">

        <table class="table align-middle">

            <thead>
            <tr>
                <th>Project Name</th>
                <th>Client</th>
                <th>Total Cost</th>
                <th>Status</th>
                <th width="220">Action</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="p : ${projects}">
                <td class="project-name" th:text="${p.projectName}"></td>

                <td th:text="${p.client.name}"></td>

                <td class="cost" th:text="'₹ ' + ${p.totalCost}"></td>

                <td>
                    <span th:if="${p.status == 'ONGOING'}" class="badge-ongoing">ONGOING</span>
                    <span th:if="${p.status == 'COMPLETED'}" class="badge-completed">COMPLETED</span>
                </td>

                <td>
                    <a th:href="@{'/projects/' + ${p.id}}" class="btn btn-sm btn-outline-success">View</a>
                    <a th:href="@{'/projects/edit/' + ${p.id}}" class="btn btn-sm btn-outline-primary">Edit</a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(projects)}">
                <td colspan="5" class="text-center text-muted p-5">
                    No projects available
                </td>
            </tr>

            </tbody>

        </table>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
