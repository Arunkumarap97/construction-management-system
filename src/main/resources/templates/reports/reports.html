<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reports</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center top-box">
        <div>
            <div class="page-title">
                Project Reports
                <span class="count-badge" th:text="${#lists.size(reports)} + ' Projects'"></span>
            </div>
            <div class="sub-title">Financial summary across all projects</div>
        </div>
    </div>
    <div class="list-card p-3 mb-4">

        <form action="/reports" class="row g-2 align-items-end" method="get">

            <div class="col-md-3">
                <label class="form-label">From Date</label>
                <input class="form-control" name="from" th:value="${from}" type="date">
            </div>

            <div class="col-md-3">
                <label class="form-label">To Date</label>
                <input class="form-control" name="to" th:value="${to}" type="date">
            </div>

            <div class="col-md-2">
                <button class="btn btn-primary w-100">Filter</button>
            </div>

            <div class="col-md-2">
                <a class="btn btn-outline-secondary w-100" href="/reports">Reset</a>
            </div>

            <div class="col-md-2">
                <a class="btn btn-success"
                   th:href="${from != null && to != null}
    ? @{'/reports/pdf?from=' + ${from} + '&to=' + ${to}}
    : @{'/reports/pdf'}">
                    Export PDF
                </a>
            </div>

        </form>

    </div>

    <div class="row g-3 mb-4">

        <div class="col-md-2">
            <div class="list-card p-3">
                <small class="text-muted">Contract</small>
                <div class="fw-bold text-primary">₹ <span th:text="${totalContract}"></span></div>
            </div>
        </div>

        <div class="col-md-2">
            <div class="list-card p-3">
                <small class="text-muted">Paid</small>
                <div class="fw-bold text-success">₹ <span th:text="${totalPaid}"></span></div>
            </div>
        </div>

        <div class="col-md-2">
            <div class="list-card p-3">
                <small class="text-muted">Expense</small>
                <div class="fw-bold text-danger">₹ <span th:text="${totalExpense}"></span></div>
            </div>
        </div>

        <div class="col-md-2">
            <div class="list-card p-3">
                <small class="text-muted">Pending</small>
                <div class="fw-bold text-warning">₹ <span th:text="${totalPending}"></span></div>
            </div>
        </div>

        <div class="col-md-2">
            <div class="list-card p-3">
                <small class="text-muted">Balance</small>
                <div class="fw-bold text-info">₹ <span th:text="${totalBalance}"></span></div>
            </div>
        </div>

        <div class="col-md-2">
            <div class="list-card p-3">
                <small class="text-muted">Profit</small>
                <div class="fw-bold text-secondary">₹ <span th:text="${totalProfit}"></span></div>
            </div>
        </div>

    </div>

    <div class="list-card">

        <table class="table align-middle">

            <thead>
            <tr>
                <th>Project</th>
                <th>Client</th>
                <th>Contract</th>
                <th>Paid</th>
                <th>Expense</th>
                <th>Pending</th>
                <th>Balance</th>
                <th>Profit</th>
                <th width="100">View</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="r : ${reports}">
                <td class="fw-semibold text-primary" th:text="${r.projectName}"></td>
                <td th:text="${r.clientName}"></td>
                <td th:text="'₹ ' + ${r.totalCost}"></td>
                <td class="text-success fw-semibold" th:text="'₹ ' + ${r.totalPaid}"></td>
                <td class="text-danger fw-semibold" th:text="'₹ ' + ${r.totalExpense}"></td>
                <td class="text-warning fw-semibold" th:text="'₹ ' + ${r.pending}"></td>

                <td th:classappend="${r.balance < 0} ? 'text-danger fw-semibold' : 'text-success fw-semibold'"
                    th:text="'₹ ' + ${r.balance}">
                </td>

                <td th:classappend="${r.profit < 0} ? 'text-danger fw-semibold' : 'text-success fw-semibold'"
                    th:text="'₹ ' + ${r.profit}">
                </td>

                <td>
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{'/projects/' + ${r.projectId}}">
                        View
                    </a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(reports)}">
                <td class="text-center text-muted p-5" colspan="9">
                    No reports available
                </td>
            </tr>

            </tbody>

        </table>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
